[tool.poetry]
name = "RiverAI"
version = "1.0.0"
description = "Telegram bot 'ИИ для Репетитора' with distributed architecture"
authors = ["Maxim Ruchyov <...>"]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
aiogram = "^3.0.0"
aio-pika = "^9.0.0"
aiohttp = "^3.8.0"
asyncpg = "^0.29.0"
redis = "^4.6.0"
python-dotenv = "^1.0.0"
loguru = "^0.7.0"
sentry-sdk = "^1.23.0"
jinja2 = "^3.1.0"
cryptography = "^41.0.0"
pycryptodome = "^3.17.0"
bcrypt = "^4.0.0"
pillow = "^10.0.0"
pytesseract = "^0.3.10"
pymupdf = "^1.24.0"
openai = "^1.3.8"
yookassa = "^3.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
