name: Автодеплой на сервера

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: очередь_RU
            host: 176.123.160.130
            key_secret: SSH_PRIVATE_KEY_QUEUE
            role: queue
            username: user1
          - name: основной_RU
            host: 176.123.160.14
            key_secret: SSH_PRIVATE_KEY_MAIN
            role: bot
            username: user1
          - name: воркер1
            host: 185.200.176.95
            key_secret: SSH_KEY_WORKER
            role: worker
            username: root
          - name: воркер2
            host: 185.200.176.98
            key_secret: SSH_KEY_WORKER
            role: worker
            username: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ matrix.host }} >> ~/.ssh/known_hosts

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.2
        env:
          # Telegram
          BOT_TOKEN:                ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID:            ${{ secrets.ADMIN_CHAT_ID }}
          # Crypto/IDs
          ENCRYPTION_KEY:           ${{ secrets.ENCRYPTION_KEY }}
          TELEGRAM_ID_SALT:         ${{ secrets.TELEGRAM_ID_SALT }}
          WORKER_ENCRYPTION_SECRET: ${{ secrets.WORKER_ENCRYPTION_SECRET }}
          # Postgres
          POSTGRES_HOST:            ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT:            ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB:              ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER:            ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:        ${{ secrets.POSTGRES_PASSWORD }}
          # Worker DSN
          WORKER_POSTGRES_DSN:      ${{ secrets.WORKER_POSTGRES_DSN }}
          # RabbitMQ
          RABBITMQ_HOST:            ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT:            ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USER:            ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS:            ${{ secrets.RABBITMQ_PASS }}
          RABBITMQ_TASK_QUEUE:      ${{ secrets.RABBITMQ_TASK_QUEUE }}
          RABBITMQ_RESULT_QUEUE:    ${{ secrets.RABBITMQ_RESULT_QUEUE }}
          # Redis
          REDIS_HOST:               ${{ secrets.REDIS_HOST }}
          REDIS_PORT:               ${{ secrets.REDIS_PORT }}
          REDIS_DB_FSM:             ${{ secrets.REDIS_DB_FSM }}
          REDIS_DB_CACHE:           ${{ secrets.REDIS_DB_CACHE }}
          # OpenAI
          OPENAI_API_KEY:           ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS:          ${{ secrets.OPENAI_API_KEYS }}
          # Yandex Disk
          YDKEY_V1:                 ${{ secrets.YDKEY_V1 }}
          YDKEY_VERSION:            ${{ secrets.YDKEY_VERSION }}
          # Payments
          PAYMENTS_PROVIDER:        ${{ secrets.PAYMENTS_PROVIDER }}
          MANUAL_PAYMENT_CARD:      ${{ secrets.MANUAL_PAYMENT_CARD }}
          YOOKASSA_SHOP_ID:         ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY:      ${{ secrets.YOOKASSA_SECRET_KEY }}
          PAYMENT_RETURN_URL:       ${{ secrets.PAYMENT_RETURN_URL }}
          PAYMENT_SUCCESS_URL:      ${{ secrets.PAYMENT_SUCCESS_URL }}
          PAYMENT_FAIL_URL:         ${{ secrets.PAYMENT_FAIL_URL }}
          PAYMENT_WEBHOOK_TOKEN:    ${{ secrets.PAYMENT_WEBHOOK_TOKEN }}
          PAYMENT_WEBHOOK_PORT:     8080
          # Observability
          SENTRY_DSN:               ${{ secrets.SENTRY_DSN }}
          DEBUG:                    ${{ secrets.DEBUG }}
        with:
          host: ${{ matrix.host }}
          username: ${{ matrix.username }}
          key: ${{ secrets[matrix.key_secret] }}
          envs: GITHUB_REPOSITORY,BOT_TOKEN,ADMIN_CHAT_ID,ENCRYPTION_KEY,TELEGRAM_ID_SALT,WORKER_ENCRYPTION_SECRET,POSTGRES_HOST,POSTGRES_PORT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD,WORKER_POSTGRES_DSN,RABBITMQ_HOST,RABBITMQ_PORT,RABBITMQ_USER,RABBITMQ_PASS,RABBITMQ_TASK_QUEUE,RABBITMQ_RESULT_QUEUE,REDIS_HOST,REDIS_PORT,REDIS_DB_FSM,REDIS_DB_CACHE,OPENAI_API_KEYS,OPENAI_API_KEY,YDKEY_V1,YDKEY_VERSION,PAYMENTS_PROVIDER,MANUAL_PAYMENT_CARD,YOOKASSA_SHOP_ID,YOOKASSA_SECRET_KEY,PAYMENT_RETURN_URL,PAYMENT_SUCCESS_URL,PAYMENT_FAIL_URL,PAYMENT_WEBHOOK_TOKEN,PAYMENT_WEBHOOK_PORT,SENTRY_DSN,DEBUG
          script: |
            #!/bin/sh
            set -eu

            REPO_SSH="git@github.com:${GITHUB_REPOSITORY}.git"
            APP_DIR="/opt/RiverAI"

            echo "==> Target: ${{ matrix.name }} (${GITHUB_REPOSITORY})"
            sudo mkdir -p /opt || true
            if [ ! -d "${APP_DIR}/.git" ]; then
              sudo git clone "${REPO_SSH}" "${APP_DIR}"
            fi

            cd "${APP_DIR}"
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo git clean -fdx

            # Каталоги по ролям + путь к compose и env
            if [ "${{ matrix.role }}" = "queue" ]; then
              COMPOSE_DIR="infrastructure/queue"
              ENV_FILE="/etc/riverai/queue.env"
            elif [ "${{ matrix.role }}" = "bot" ]; then
              COMPOSE_DIR="infrastructure/bot"
              ENV_FILE="/etc/riverai/bot.env"
            else
              COMPOSE_DIR="infrastructure/worker"
              ENV_FILE="/etc/riverai/worker.env"
            fi

            # Сформируем env
            sudo mkdir -p /etc/riverai
            TMP_ENV="$(mktemp)"

            put() {
              K="$1"; V="$(eval echo \"\${$1-}\")"
              # если нет OPENAI_API_KEY — первый из OPENAI_API_KEYS
              if [ "$K" = "OPENAI_API_KEY" ] && [ -z "${V:-}" ] && [ -n "${OPENAI_API_KEYS:-}" ]; then
                V="$(printf "%s" "$OPENAI_API_KEYS" | cut -d',' -f1)"
              fi
              case "$K" in
                RABBITMQ_TASK_QUEUE)  [ -z "$V" ] && V="task_queue" ;;
                RABBITMQ_RESULT_QUEUE)[ -z "$V" ] && V="result_queue" ;;
                REDIS_DB_FSM)         [ -z "$V" ] && V="0" ;;
                REDIS_DB_CACHE)       [ -z "$V" ] && V="1" ;;
                PAYMENT_WEBHOOK_PORT) [ -z "$V" ] && V="8080" ;;
                PAYMENTS_PROVIDER)    [ -z "$V" ] && V="manual" ;;
                DEBUG)                [ -z "$V" ] && V="0" ;;
              esac
              printf "%s=%s\n" "$K" "$V" >> "$TMP_ENV"
            }

            for K in \
              BOT_TOKEN ADMIN_CHAT_ID \
              ENCRYPTION_KEY TELEGRAM_ID_SALT WORKER_ENCRYPTION_SECRET \
              POSTGRES_HOST POSTGRES_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD \
              WORKER_POSTGRES_DSN \
              RABBITMQ_HOST RABBITMQ_PORT RABBITMQ_USER RABBITMQ_PASS RABBITMQ_TASK_QUEUE RABBITMQ_RESULT_QUEUE \
              REDIS_HOST REDIS_PORT REDIS_DB_FSM REDIS_DB_CACHE \
              OPENAI_API_KEY OPENAI_API_KEYS \
              YDKEY_V1 YDKEY_VERSION \
              PAYMENTS_PROVIDER MANUAL_PAYMENT_CARD \
              YOOKASSA_SHOP_ID YOOKASSA_SECRET_KEY \
              PAYMENT_RETURN_URL PAYMENT_SUCCESS_URL PAYMENT_FAIL_URL PAYMENT_WEBHOOK_TOKEN PAYMENT_WEBHOOK_PORT \
              SENTRY_DSN DEBUG \
            ; do put "$K"; done

            CUR="$(id -un)"
            sudo install -o "$CUR" -g "$CUR" -m 600 "$TMP_ENV" "$ENV_FILE"
            rm -f "$TMP_ENV"

            # Делаем ДВА симлинка на один ENV:
            # 1) рядом с docker-compose.yml (на случай env_file: ./.env)
            sudo ln -sfn "$ENV_FILE" "${APP_DIR}/${COMPOSE_DIR}/.env"
            # 2) в корне репо (на случай env_file: ../../.env)
            sudo ln -sfn "$ENV_FILE" "${APP_DIR}/.env"

            # Логи
            sudo mkdir -p "${APP_DIR}/logs"
            sudo sh -c "echo \"$(date +'%F %T') — Деплой стартовал на ${{ matrix.name }}\" >> '${APP_DIR}/logs/deploy.log'"

            # TMPDIR + BuildKit
            sudo mkdir -p /opt/tmp
            sudo chmod 1777 /opt/tmp
            export TMPDIR="/opt/tmp"
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1

            # Чистка при нехватке места
            USAGE="$(df --output=pcent / | tail -1 | tr -dc '0-9' || echo 0)"
            if [ "$USAGE" -ge 85 ]; then
              docker system prune -af --volumes || true
              docker builder prune -af || true
            fi

            # Запуск compose (и .env теперь доступен по ОБОИМ путям)
            cd "${APP_DIR}/${COMPOSE_DIR}"
            if command -v docker compose >/dev/null 2>&1; then
              docker compose --env-file "$ENV_FILE" up -d --build --remove-orphans
            else
              docker-compose --env-file "$ENV_FILE" up -d --remove-orphans --build
            fi

            sudo sh -c "echo \"$(date +'%F %T') — Деплой завершён на ${{ matrix.name }}\" >> '${APP_DIR}/logs/deploy.log'"
