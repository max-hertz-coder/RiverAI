name: Автодеплой на сервера

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: очередь_RU
            host: 176.123.160.130
            key_secret: SSH_PRIVATE_KEY_QUEUE
            role: queue
            username: user1

          - name: основной_RU
            host: 176.123.160.14
            key_secret: SSH_PRIVATE_KEY_MAIN
            role: bot
            username: user1

          - name: воркер1
            host: 185.200.176.95
            key_secret: SSH_KEY_WORKER
            role: worker
            username: root

          - name: воркер2
            host: 185.200.176.98
            key_secret: SSH_KEY_WORKER
            role: worker
            username: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add hosts to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ matrix.host }} >> ~/.ssh/known_hosts

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.2
        env:
          # Telegram
          BOT_TOKEN:              ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID:          ${{ secrets.ADMIN_CHAT_ID }}
          # Crypto/IDs
          ENCRYPTION_KEY:         ${{ secrets.ENCRYPTION_KEY }}
          TELEGRAM_ID_SALT:       ${{ secrets.TELEGRAM_ID_SALT }}
          # Postgres (bot)
          POSTGRES_HOST:          ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT:          ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB:            ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER:          ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD:      ${{ secrets.POSTGRES_PASSWORD }}
          # Postgres DSN (worker)
          WORKER_POSTGRES_DSN:    ${{ secrets.WORKER_POSTGRES_DSN }}
          # RabbitMQ
          RABBITMQ_HOST:          ${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT:          ${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_USER:          ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS:          ${{ secrets.RABBITMQ_PASS }}
          RABBITMQ_TASK_QUEUE:    ${{ vars.RABBITMQ_TASK_QUEUE || 'task_queue' }}
          RABBITMQ_RESULT_QUEUE:  ${{ vars.RABBITMQ_RESULT_QUEUE || 'result_queue' }}
          # Redis
          REDIS_HOST:             ${{ secrets.REDIS_HOST }}
          REDIS_PORT:             ${{ secrets.REDIS_PORT }}
          REDIS_DB_FSM:           ${{ vars.REDIS_DB_FSM || '0' }}
          REDIS_DB_CACHE:         ${{ vars.REDIS_DB_CACHE || '1' }}
          # OpenAI
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_KEYS:        ${{ secrets.OPENAI_API_KEYS }}
          # Yandex Disk
          YDKEY_V1:               ${{ secrets.YDKEY_V1 }}
          YDKEY_VERSION:          ${{ secrets.YDKEY_VERSION }}
          # Payments
          PAYMENTS_PROVIDER:      ${{ vars.PAYMENTS_PROVIDER || 'manual' }}
          MANUAL_PAYMENT_CARD:    ${{ secrets.MANUAL_PAYMENT_CARD }}
          # YooKassa (необязательно для manual)
          YOOKASSA_SHOP_ID:       ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY:    ${{ secrets.YOOKASSA_SECRET_KEY }}
          PAYMENT_RETURN_URL:     ${{ secrets.PAYMENT_RETURN_URL }}
          PAYMENT_SUCCESS_URL:    ${{ secrets.PAYMENT_SUCCESS_URL }}
          PAYMENT_FAIL_URL:       ${{ secrets.PAYMENT_FAIL_URL }}
          PAYMENT_WEBHOOK_TOKEN:  ${{ secrets.PAYMENT_WEBHOOK_TOKEN }}
          PAYMENT_WEBHOOK_PORT:   ${{ vars.PAYMENT_WEBHOOK_PORT || '8080' }}
          # Observability
          SENTRY_DSN:             ${{ secrets.SENTRY_DSN }}
          DEBUG:                  ${{ vars.DEBUG || '0' }}
        with:
          host: ${{ matrix.host }}
          username: ${{ matrix.username }}
          key: ${{ secrets[matrix.key_secret] }}
          envs: |
            GITHUB_REPOSITORY, \
            BOT_TOKEN, ADMIN_CHAT_ID, \
            ENCRYPTION_KEY, TELEGRAM_ID_SALT, \
            POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD, \
            WORKER_POSTGRES_DSN, \
            RABBITMQ_HOST, RABBITMQ_PORT, RABBITMQ_USER, RABBITMQ_PASS, RABBITMQ_TASK_QUEUE, RABBITMQ_RESULT_QUEUE, \
            REDIS_HOST, REDIS_PORT, REDIS_DB_FSM, REDIS_DB_CACHE, \
            OPENAI_API_KEYS, OPENAI_API_KEY, \
            YDKEY_V1, YDKEY_VERSION, \
            PAYMENTS_PROVIDER, MANUAL_PAYMENT_CARD, \
            YOOKASSA_SHOP_ID, YOOKASSA_SECRET_KEY, \
            PAYMENT_RETURN_URL, PAYMENT_SUCCESS_URL, PAYMENT_FAIL_URL, PAYMENT_WEBHOOK_TOKEN, PAYMENT_WEBHOOK_PORT, \
            SENTRY_DSN, DEBUG
          script: |
            set -euo pipefail
            if [ -z "${USER:-}" ]; then USER="$(id -un)"; fi

            REPO_SSH="git@github.com:${GITHUB_REPOSITORY}.git"
            APP_DIR="/opt/RiverAI"

            echo "==> Target: ${{ matrix.name }} (${GITHUB_REPOSITORY})"
            sudo mkdir -p /opt || true

            if [ ! -d "${APP_DIR}/.git" ]; then
              sudo git clone "${REPO_SSH}" "${APP_DIR}"
            fi

            cd "${APP_DIR}"
            sudo git fetch origin main
            sudo git reset --hard origin/main
            sudo git clean -fdx

            # Логи
            sudo mkdir -p "${APP_DIR}/logs"
            echo "$(date +'%F %T') — Деплой стартовал на ${{ matrix.name }}" | sudo tee -a "${APP_DIR}/logs/deploy.log" >/dev/null

            # Выбираем каталог с compose по роли
            if [ "${{ matrix.role }}" = "queue" ]; then
              COMPOSE_DIR="infrastructure/queue"
              ENV_PATH="${COMPOSE_DIR}/.env"
            elif [ "${{ matrix.role }}" = "bot" ]; then
              COMPOSE_DIR="infrastructure/bot"
              ENV_PATH=".env"
            elif [ "${{ matrix.role }}" = "worker" ]; then
              COMPOSE_DIR="infrastructure/worker"
              ENV_PATH=".env"
            else
              echo "Unknown role: ${{ matrix.role }}" | sudo tee -a "${APP_DIR}/logs/deploy.log" >/dev/null
              exit 2
            fi

            sudo mkdir -p "$(dirname "${ENV_PATH}")"

            # Временный .env создаём в каталоге проекта (не в /tmp) и отдаём права текущему пользователю
            tmp_env="$(mktemp -p "${APP_DIR}" .env.tmp.XXXXXX)"
            sudo chown "$USER":"$USER" "$tmp_env"

            # Если есть старый .env — копируем содержимое без sudo-перенаправления
            if [ -f "${ENV_PATH}" ]; then
              sudo cp "${ENV_PATH}" "$tmp_env"
              sudo chown "$USER":"$USER" "$tmp_env"
            fi

            # Собираем новое содержимое .env (записываем как обычный пользователь)
            declare -A secrets=(
              [BOT_TOKEN]="${BOT_TOKEN:-}"
              [ADMIN_CHAT_ID]="${ADMIN_CHAT_ID:-}"
              [ENCRYPTION_KEY]="${ENCRYPTION_KEY:-}"
              [TELEGRAM_ID_SALT]="${TELEGRAM_ID_SALT:-}"

              [POSTGRES_HOST]="${POSTGRES_HOST:-}"
              [POSTGRES_PORT]="${POSTGRES_PORT:-}"
              [POSTGRES_DB]="${POSTGRES_DB:-}"
              [POSTGRES_USER]="${POSTGRES_USER:-}"
              [POSTGRES_PASSWORD]="${POSTGRES_PASSWORD:-}"
              [WORKER_POSTGRES_DSN]="${WORKER_POSTGRES_DSN:-}"

              [RABBITMQ_HOST]="${RABBITMQ_HOST:-}"
              [RABBITMQ_PORT]="${RABBITMQ_PORT:-}"
              [RABBITMQ_USER]="${RABBITMQ_USER:-}"
              [RABBITMQ_PASS]="${RABBITMQ_PASS:-}"
              [RABBITMQ_TASK_QUEUE]="${RABBITMQ_TASK_QUEUE:-}"
              [RABBITMQ_RESULT_QUEUE]="${RABBITMQ_RESULT_QUEUE:-}"

              [REDIS_HOST]="${REDIS_HOST:-}"
              [REDIS_PORT]="${REDIS_PORT:-}"
              [REDIS_DB_FSM]="${REDIS_DB_FSM:-}"
              [REDIS_DB_CACHE]="${REDIS_DB_CACHE:-}"

              [OPENAI_API_KEYS]="${OPENAI_API_KEYS:-}"
              [OPENAI_API_KEY]="${OPENAI_API_KEY:-}"

              [YDKEY_V1]="${YDKEY_V1:-}"
              [YDKEY_VERSION]="${YDKEY_VERSION:-}"

              [PAYMENTS_PROVIDER]="${PAYMENTS_PROVIDER:-}"
              [MANUAL_PAYMENT_CARD]="${MANUAL_PAYMENT_CARD:-}"

              [YOOKASSA_SHOP_ID]="${YOOKASSA_SHOP_ID:-}"
              [YOOKASSA_SECRET_KEY]="${YOOKASSA_SECRET_KEY:-}"
              [PAYMENT_RETURN_URL]="${PAYMENT_RETURN_URL:-}"
              [PAYMENT_SUCCESS_URL]="${PAYMENT_SUCCESS_URL:-}"
              [PAYMENT_FAIL_URL]="${PAYMENT_FAIL_URL:-}"
              [PAYMENT_WEBHOOK_TOKEN]="${PAYMENT_WEBHOOK_TOKEN:-}"
              [PAYMENT_WEBHOOK_PORT]="${PAYMENT_WEBHOOK_PORT:-}"

              [SENTRY_DSN]="${SENTRY_DSN:-}"
              [DEBUG]="${DEBUG:-}"
            )

            for key in "${!secrets[@]}"; do
              val="${secrets[$key]}"
              if [ -n "$val" ]; then
                if grep -qE "^${key}=" "$tmp_env" 2>/dev/null; then
                  sed -i "s|^${key}=.*|${key}=${val}|" "$tmp_env"
                else
                  printf "%s=%s\n" "$key" "$val" >> "$tmp_env"
                fi
              fi
            done

            # Кладём итоговый .env с правильными правами
            sudo install -m 600 "$tmp_env" "$ENV_PATH"
            rm -f "$tmp_env"

            # Запускаем из каталога с compose
            cd "${APP_DIR}/${COMPOSE_DIR}"

            if command -v docker compose &> /dev/null; then
              docker compose up -d --build --remove-orphans
            else
              docker-compose up -d --build --remove-orphans
            fi

            echo "$(date +'%F %T') — Деплой завершён на ${{ matrix.name }}" | sudo tee -a "${APP_DIR}/logs/deploy.log" >/dev/null
