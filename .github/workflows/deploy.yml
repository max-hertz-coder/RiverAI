name: Автодеплой на сервера

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: очередь_RU
            host: 176.123.160.130
            secret_key: SSH_PRIVATE_KEY_QUEUE
            role: queue
            username: user1
          - name: основной_RU
            host: 176.123.160.14
            secret_key: SSH_PRIVATE_KEY_MAIN
            role: app
            username: user1
          - name: очередь
            host: 185.200.176.96
            secret_key: SSH_KEY_QUEUE
            role: queue
            username: root
          - name: основной
            host: 185.200.176.99
            secret_key: SSH_KEY_BASED
            role: app
            username: root
          - name: резервный
            host: 185.200.176.97
            secret_key: SSH_KEY_RESERVE
            role: app
            username: root
          - name: воркер1
            host: 185.200.176.95
            secret_key: SSH_KEY_WORKER
            role: app
            username: root
          - name: воркер2
            host: 185.200.176.98
            secret_key: SSH_KEY_WORKER
            role: app
            username: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ matrix.host }}
          username: ${{ matrix.username }}
          key: ${{ secrets[matrix.secret_key] }}
          envs: TELEGRAM_ID_SALT,WORKER_ENCRYPTION_SECRET,YDKEY_V1,YDKEY_VERSION
          script: |
            # 1. Клонирование или обновление кода
            if [ ! -d /opt/RiverAI/.git ]; then
              git clone git@github.com:max-hertz-coder/RiverAI.git /opt/RiverAI
            fi
            cd /opt/RiverAI
            git pull origin main || { git fetch origin main && git reset --hard origin/main && git clean -fd; }

            # 2. Логирование в файл
            mkdir -p /opt/RiverAI/logs
            exec > >(tee -a /opt/RiverAI/logs/deploy.log) 2>&1
            echo "$(date +'%F %T') — Деплой стартовал на сервере ${{ matrix.name }}"

            # 3. Определение пути до .env.override
            if [ "${{ matrix.role }}" = "queue" ]; then
              ENV_PATH="./infrastructure/queue/.env.override"
            else
              ENV_PATH=".env.override"
            fi

            # 4. Создание .env.override
            echo "TELEGRAM_ID_SALT=${TELEGRAM_ID_SALT}" > "$ENV_PATH"
            echo "WORKER_ENCRYPTION_SECRET=${WORKER_ENCRYPTION_SECRET}" >> "$ENV_PATH"
            echo "YDKEY_V1=${YDKEY_V1}" >> "$ENV_PATH"
            echo "YDKEY_VERSION=${YDKEY_VERSION}" >> "$ENV_PATH"
            echo "POSTGRES_DSN=${WORKER_POSTGRES_DSN}" >> "$ENV_PATH"


            # 5. Запуск docker compose
            if command -v docker compose &> /dev/null; then
              docker compose up -d --build --remove-orphans
            else
              docker-compose up -d --build --remove-orphans
            fi


            echo "$(date +'%F %T') — Деплой завершён на сервере ${{ matrix.name }}"
