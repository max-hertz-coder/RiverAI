name: Автодеплой на сервера

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: очередь (RU)
            host: 176.123.160.130
            secret_key: SSH_PRIVATE_KEY_QUEUE
            role: queue
            username: user1
          - name: основной (RU)
            host: 176.123.160.14
            secret_key: SSH_PRIVATE_KEY_MAIN
            role: app
            username: user1
          - name: очередь (NL)
            host: 185.200.176.96
            secret_key: SSH_KEY_QUEUE
            role: queue
            username: root
          - name: основной (NL)
            host: 185.200.176.99
            secret_key: SSH_KEY_BASED
            role: app
            username: root
          - name: резервный (NL)
            host: 185.200.176.97
            secret_key: SSH_KEY_RESERVE
            role: app
            username: root
          - name: воркер1
            host: 185.200.176.95
            secret_key: SSH_KEY_WORKER
            role: app
            username: root
          - name: воркер2
            host: 185.200.176.98
            secret_key: SSH_KEY_WORKER
            role: app
            username: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ matrix.host }}
          username: ${{ matrix.username }}
          key: ${{ secrets[matrix.secret_key] }}
          script: |
            echo "--- DEPLOY START ---"
            set -e
            mkdir -p /opt/RiverAI

            # Проверка наличия репозитория
            if [ ! -d /opt/RiverAI/.git ]; then
              git clone https://github.com/max-hertz-coder/RiverAI.git /opt/RiverAI
            fi
            cd /opt/RiverAI

            # Жёсткий сброс и обновление
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Логирование
            mkdir -p logs
            exec > >(tee -a logs/deploy.log) 2>&1
            echo "$(date +'%F %T') — Начало деплоя на сервере ${{ matrix.name }}"

            # Переход в папку очереди, если нужно
            if [ "${{ matrix.role }}" = "queue" ]; then
              cd queue
            fi

            # Универсальный вызов docker-compose
            if command -v docker compose &> /dev/null; then
              docker compose up -d --build --remove-orphans
            else
              docker-compose up -d --build --remove-orphans
            fi

            echo "$(date +'%F %T') — Деплой успешно завершён на сервере ${{ matrix.name }}"
            echo "--- DEPLOY END ---"

