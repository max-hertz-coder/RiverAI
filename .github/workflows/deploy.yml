name: Автодеплой на сервера

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: очередь (RU)
            host: ${{ secrets.HOST_QUEUE_RU }}
            secret_key: SSH_PRIVATE_KEY_QUEUE
            role: queue
          - name: основной (RU)
            host: ${{ secrets.HOST_MAIN_RU }}
            secret_key: SSH_PRIVATE_KEY_MAIN
            role: app
          - name: очередь (NL)
            host: 185.200.176.96
            secret_key: SSH_KEY_QUEUE
            role: queue
          - name: основной (NL)
            host: 185.200.176.99
            secret_key: SSH_KEY_BASED
            role: app
          - name: резервный (NL)
            host: 185.200.176.97
            secret_key: SSH_KEY_RESERVE
            role: app
          - name: воркер1
            host: 185.200.176.95
            secret_key: SSH_KEY_WORKER
            role: app
          - name: воркер2
            host: 185.200.176.98
            secret_key: SSH_KEY_WORKER
            role: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ matrix.host }}
          username: user1
          key: ${{ secrets[matrix.secret_key] }}
          script: |
            mkdir -p /opt/RiverAI
            cd /opt

            if [ ! -d RiverAI/.git ]; then
              git clone git@github.com:max-hertz-coder/RiverAI.git RiverAI
            fi
            cd RiverAI
            git pull origin main || { git fetch origin main && git reset --hard origin/main && git clean -fd; }

            mkdir -p /opt/RiverAI/logs
            exec > >(tee -a /opt/RiverAI/logs/deploy.log) 2>&1
            echo "$(date +'%F %T') — Начало деплоя на сервере ${{ matrix.name }}"

            if [ "${{ matrix.role }}" = "queue" ]; then
              cd queue
            fi

            docker compose up -d --build --remove-orphans

            echo "$(date +'%F %T') — Деплой успешно завершён на сервере ${{ matrix.name }}"
