name: Автодеплой на сервера

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: очередь_RU
            host: 176.123.160.130
            key_secret: SSH_PRIVATE_KEY_QUEUE
            role: queue
            username: user1

          - name: основной_RU
            host: 176.123.160.14
            key_secret: SSH_PRIVATE_KEY_MAIN
            role: app
            username: user1

          - name: очередь
            host: 185.200.176.96
            key_secret: SSH_KEY_QUEUE
            role: queue
            username: root

          - name: основной
            host: 185.200.176.99
            key_secret: SSH_KEY_BASED
            role: app
            username: root

          - name: резервный
            host: 185.200.176.97
            key_secret: SSH_KEY_RESERVE
            role: app
            username: root

          - name: воркер1
            host: 185.200.176.95
            key_secret: SSH_KEY_WORKER
            role: app
            username: root

          - name: воркер2
            host: 185.200.176.98
            key_secret: SSH_KEY_WORKER
            role: app
            username: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add GitHub to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      - name: Deploy to ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ matrix.host }}
          username: ${{ matrix.username }}
          key: ${{ secrets[matrix.key_secret] }}
          envs: TELEGRAM_ID_SALT,WORKER_ENCRYPTION_SECRET,YDKEY_V1,YDKEY_VERSION,WORKER_POSTGRES_DSN
          script: |
            cd /opt
            if [ ! -d /opt/RiverAI/.git ]; then
              git clone git@github.com:max-hertz-coder/RiverAI.git /opt/RiverAI
            fi
            cd /opt/RiverAI
            git pull origin main || { git fetch origin main && git reset --hard origin/main && git clean -fd; }

            mkdir -p /opt/RiverAI/logs
            exec > >(tee -a /opt/RiverAI/logs/deploy.log) 2>&1
            echo "$(date +'%F %T') — Деплой стартовал на ${{ matrix.name }}"

            if [ "${{ matrix.role }}" = "queue" ]; then
              ENV_PATH="./infrastructure/queue/.env"
            else
              ENV_PATH=".env"
            fi

            tmp_env="$(mktemp)"
            [ -f "$ENV_PATH" ] && cat "$ENV_PATH" > "$tmp_env"

            declare -A secrets=(
              [TELEGRAM_ID_SALT]="$TELEGRAM_ID_SALT"
              [WORKER_ENCRYPTION_SECRET]="$WORKER_ENCRYPTION_SECRET"
              [YDKEY_V1]="$YDKEY_V1"
              [YDKEY_VERSION]="$YDKEY_VERSION"
              [WORKER_POSTGRES_DSN]="$WORKER_POSTGRES_DSN"
            )

            for key in "${!secrets[@]}"; do
              grep -q "^$key=" "$tmp_env" && sed -i "s|^$key=.*|$key=${secrets[$key]}|" "$tmp_env" || echo "$key=${secrets[$key]}" >> "$tmp_env"
            done

            mv "$tmp_env" "$ENV_PATH"

            if command -v docker compose &> /dev/null; then
              docker compose up -d --build --remove-orphans
            else
              docker-compose up -d --build --remove-orphans
            fi

            echo "$(date +'%F %T') — Деплой завершён на ${{ matrix.name }}"
