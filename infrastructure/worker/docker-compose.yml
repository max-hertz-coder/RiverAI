services:
  worker:
    container_name: riverai-worker-1
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ../../.env       # подтянет все переменные (RABBITMQ_*, REDIS_*, POSTGRES_*)
    networks:
      - internal   # Имя сети точно такое же, как создано в очереди

networks:
  internal:
    external: true
