
services:
  worker:
    container_name: riverai-worker-1
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ../../.env     # подтянет все нужные переменные (RABBITMQ_*, REDIS_*, POSTGRES_*)
    networks:
      - queue_internal # подключаем к той же сети, где запущены redis & rabbitmq

networks:
  queue_internal:
    external: true
