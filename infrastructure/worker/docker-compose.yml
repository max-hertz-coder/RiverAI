services:
  worker:
    build:
      context: ../..
      dockerfile: Dockerfile.worker
    container_name: riverai-worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      TELEGRAM_ID_SALT: ${TELEGRAM_ID_SALT}
      WORKER_ENCRYPTION_SECRET: ${WORKER_ENCRYPTION_SECRET}
      YDKEY_V1: ${YDKEY_V1}
      YDKEY_VERSION: ${YDKEY_VERSION}
      WORKER_POSTGRES_DSN: ${WORKER_POSTGRES_DSN}
      # Важно: здесь RABBITMQ_HOST должен быть IP сервера очереди!
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - riverai-network

networks:
  riverai-network:
    external: true
