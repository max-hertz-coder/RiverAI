services:
  redis:
    image: redis:7-alpine
    container_name: queue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - riverai-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: queue-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - riverai-network

  queue-server:
    build:
      context: ../..
      dockerfile: queue_server/Dockerfile
    container_name: queue-server
    restart: unless-stopped
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - .env
    environment:
      - TELEGRAM_ID_SALT
      - WORKER_ENCRYPTION_SECRET
      - ENCRYPTION_KEY
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - riverai-network

networks:
  riverai-network:
    external: true
