# infrastructure/queue/docker-compose.yml

networks:
  riverai-network:
    external: true     # <— используем существующую сеть, НЕ создаём заново
    name: riverai-network

volumes:
  rabbitmq_data:
  redis_data:

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: queue-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-change_me}
      RABBITMQ_NODENAME: rabbit@queue-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - riverai-network

  redis:
    image: redis:7-alpine
    container_name: queue-redis
    restart: unless-stopped
    command:
      - redis-server
      - "--save"
      - ""
      - "--appendonly"
      - "no"
      - "--protected-mode"
      - "no"             # <— разрешаем внешние подключения (вместо DENIED)
      - "--bind"
      - "0.0.0.0"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - riverai-network

  queue-server:
    image: queue-queue-server
    container_name: queue-server
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit_user}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-change_me}
      RABBITMQ_TASK_QUEUE: ${RABBITMQ_TASK_QUEUE:-task_queue}
      RABBITMQ_RESULT_QUEUE: ${RABBITMQ_RESULT_QUEUE:-result_queue}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB_CACHE: ${REDIS_DB_CACHE:-1}
      RABBITMQ_TASK_TTL_MS: ${RABBITMQ_TASK_TTL_MS:-900000}
    networks:
      - riverai-network
