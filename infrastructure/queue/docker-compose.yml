services:
  redis:
    image: redis:7-alpine
    container_name: queue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - riverai-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: queue-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - riverai-network

  queue-server:
    build:
      context: ../..
      dockerfile: queue_server/Dockerfile
    container_name: queue-server
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TELEGRAM_ID_SALT: ${TELEGRAM_ID_SALT}
      WORKER_ENCRYPTION_SECRET: ${WORKER_ENCRYPTION_SECRET}
      YDKEY_V1: ${YDKEY_V1}
      YDKEY_VERSION: ${YDKEY_VERSION}
      WORKER_POSTGRES_DSN: ${WORKER_POSTGRES_DSN}
      # RABBITMQ_HOST здесь должен ссылаться на IP/домен ЭТОГО сервера (или имя контейнера 'rabbitmq' внутри этой машины)
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - riverai-network

volumes:
  redis-data:
  rabbitmq-data:

networks:
  riverai-network:
    external: true
