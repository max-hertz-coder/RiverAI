services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile.bot
    container_name: riverai-bot
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - TELEGRAM_ID_SALT
      - WORKER_ENCRYPTION_SECRET
      - ENCRYPTION_KEY
      - YDKEY_V1
      - YDKEY_VERSION
      - WORKER_POSTGRES_DSN
    networks:
      - riverai-network

networks:
  riverai-network:
    external: true
