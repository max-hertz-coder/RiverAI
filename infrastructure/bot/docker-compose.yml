services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile.bot
    container_name: riverai-bot
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      TELEGRAM_ID_SALT: ${TELEGRAM_ID_SALT}
      WORKER_ENCRYPTION_SECRET: ${WORKER_ENCRYPTION_SECRET}
      YDKEY_V1: ${YDKEY_V1}
      YDKEY_VERSION: ${YDKEY_VERSION}
      WORKER_POSTGRES_DSN: ${WORKER_POSTGRES_DSN}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-yookassa}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN}
    networks:
      - riverai-network
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "5" }

  payments-web:
    build:
      context: ../..
      dockerfile: Dockerfile.bot
    container_name: riverai-payhook
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      WORKER_POSTGRES_DSN: ${WORKER_POSTGRES_DSN}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN}
      PAYMENT_WEBHOOK_PORT: ${PAYMENT_WEBHOOK_PORT:-8080}
      BOT_TOKEN: ${BOT_TOKEN}
      # чек ЮKassa:
      YOOKASSA_SEND_RECEIPT: ${YOOKASSA_SEND_RECEIPT:-1}
      YOOKASSA_VAT_CODE: ${YOOKASSA_VAT_CODE:-4}
      # YOOKASSA_TAX_SYSTEM_CODE: ${YOOKASSA_TAX_SYSTEM_CODE} # если нужно
    command: python -m bot_app.run_payment_web
    ports:
      - "${PAYMENT_WEBHOOK_PORT:-8080}:8080"   # наружу:внутри (HTTP)
    networks:
      - riverai-network
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "5" }

networks:
  riverai-network:
    external: true
