services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile.bot
    container_name: riverai-bot
    env_file:
      - ../../.env
      - ../../.env.override  # ← добавлен
    restart: unless-stopped
    networks:
      - riverai-network
    environment:
      - TELEGRAM_ID_SALT

networks:
  riverai-network:
    external: true
