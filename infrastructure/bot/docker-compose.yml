services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile.bot
    container_name: riverai-bot
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      TELEGRAM_ID_SALT: ${TELEGRAM_ID_SALT}
      WORKER_ENCRYPTION_SECRET: ${WORKER_ENCRYPTION_SECRET}
      YDKEY_V1: ${YDKEY_V1}
      YDKEY_VERSION: ${YDKEY_VERSION}
      WORKER_POSTGRES_DSN: ${WORKER_POSTGRES_DSN}
      # вебхук оплаты (aiohttp в main.py)
      PAYMENT_WEBHOOK_PORT: ${PAYMENT_WEBHOOK_PORT:-8080}
    ports:
      # наружу:внутри-контейнера
      - "${PAYMENT_WEBHOOK_PORT:-8080}:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - riverai-network

networks:
  riverai-network:
    external: true
