services:
  bot:
    build:
      context: ../..
      dockerfile: Dockerfile.bot
    container_name: riverai-bot
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      TELEGRAM_ID_SALT: ${TELEGRAM_ID_SALT}
      WORKER_ENCRYPTION_SECRET: ${WORKER_ENCRYPTION_SECRET}
      YDKEY_V1: ${YDKEY_V1}
      YDKEY_VERSION: ${YDKEY_VERSION}
      WORKER_POSTGRES_DSN: ${WORKER_POSTGRES_DSN}
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-yookassa}
      # токен (секрет) для вебхука — тот самый, что будем передавать в ?token=
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN}
    # Порт 8080 теперь у payments-web, поэтому маппинг из bot убираем
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - riverai-network

  payments-web:
    build:
      context: ../..
      dockerfile: Dockerfile.bot
    container_name: riverai-payhook
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      WORKER_POSTGRES_DSN: ${WORKER_POSTGRES_DSN}
      PAYMENT_WEBHOOK_PORT: ${PAYMENT_WEBHOOK_PORT:-8080}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    command: python -m bot_app.run_payment_web
    ports:
      - "${PAYMENT_WEBHOOK_PORT:-8080}:8080"   # наружу:внутри
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - riverai-network

networks:
  riverai-network:
    external: true
