# Redis configuration for RiverAI Queue Server

################################## NETWORK #####################################
bind 0.0.0.0
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

#################################### SECURITY ##################################
# ВАЖНО: задайте реальный пароль через конфиг/секреты контейнера.
requirepass <YOUR_STRONG_PASSWORD>

################################## PERSISTENCE #################################
save ""
appendonly no

################################## MEMORY POLICY ###############################
maxmemory 256mb
maxmemory-policy allkeys-lru

################################## DATABASE ####################################
databases 16
# 0 – FSM (Aiogram)
# 1 – кэш/контексты GPT

################################## LOGGING & SLOWLOG ###########################
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 128

################################## ADVANCED ####################################
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""
rename-command SHUTDOWN ""
rename-command KEYS ""
